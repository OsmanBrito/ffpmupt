<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ffmpupt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ffpmupt</title>
  <link rel="manifest" href="manifest.json">

  <script>
    if (window.location.pathname === '/ofertas' && !window.location.hash) {
      window.location.replace('/#/ofertas');
    }
  </script>
  <script>
    let offlineWorkerReady;

    if ('serviceWorker' in navigator) {
      offlineWorkerReady = navigator.serviceWorker
        .register('offline_service_worker.js')
        .then(() => navigator.serviceWorker.ready);

      if (navigator.storage?.persist) {
        navigator.storage.persist();
      }
    }

    window.ffpmuCacheAudio = function(urls) {
      if (!offlineWorkerReady) return;
      offlineWorkerReady.then((registration) => {
        registration.active?.postMessage({type: 'CACHE_AUDIO', urls});
      });
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
</body>
</html>
