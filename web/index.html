<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FFPMU Connect for Sunday services and country content.">
  <meta name="theme-color" content="#173F39">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FFPMU Connect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FFPMU Connect</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background: #f7f5ef;
      margin: 0;
      min-height: 100%;
    }

    #app-loading {
      align-items: center;
      background: #f7f5ef;
      color: #173f39;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      inset: 0;
      justify-content: center;
      position: fixed;
      z-index: 9999;
    }

    #app-loading img {
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(23, 63, 57, 0.16);
      height: 88px;
      width: 88px;
    }

    #app-loading strong {
      font-size: 22px;
      margin-top: 18px;
    }

    #app-loading span {
      color: #5d6965;
      font-size: 14px;
      margin-top: 6px;
    }

    #app-loading::after {
      animation: loading 1.1s ease-in-out infinite;
      background: #d9eee6;
      border-radius: 999px;
      content: "";
      height: 4px;
      margin-top: 22px;
      transform-origin: left center;
      width: 112px;
    }

    @keyframes loading {
      0%, 100% { transform: scaleX(.28); opacity: .55; }
      50% { transform: scaleX(1); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loading::after { animation: none; }
    }
  </style>

  <script>
    if (window.location.pathname === '/ofertas' && !window.location.hash) {
      window.location.replace('/#/ofertas');
    }
  </script>
  <script>
    let offlineWorkerReady;
    let lastAudioCacheProgress;
    let pendingAudioUrls = [];
    const audioCacheListeners = new Set();

    function sendAudioCacheRequest() {
      if (!offlineWorkerReady || pendingAudioUrls.length === 0) return;
      offlineWorkerReady.then((registration) => {
        registration.active?.postMessage({
          type: 'CACHE_AUDIO',
          urls: pendingAudioUrls,
        });
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data?.type !== 'AUDIO_CACHE_PROGRESS') return;
        lastAudioCacheProgress = event.data;
        audioCacheListeners.forEach((listener) => listener(event.data));
      });

      offlineWorkerReady = navigator.serviceWorker
        .register('offline_service_worker.js')
        .then(() => navigator.serviceWorker.ready);

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        offlineWorkerReady = navigator.serviceWorker.ready;
        sendAudioCacheRequest();
      });

      if (navigator.storage?.persist) {
        navigator.storage.persist();
      }
    }

    window.ffpmuCacheAudio = function(urls) {
      pendingAudioUrls = [...new Set(urls)];
      sendAudioCacheRequest();
    };

    window.ffpmuListenAudioCache = function(listener) {
      audioCacheListeners.add(listener);
      if (lastAudioCacheProgress) listener(lastAudioCacheProgress);
    };

    window.ffpmuToggleFullscreen = function() {
      if (document.fullscreenElement) {
        document.exitFullscreen?.();
      } else {
        document.documentElement.requestFullscreen?.();
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <img src="icons/ffpmu-connect-mark.svg" alt="">
    <strong>FFPMU Connect</strong>
    <span>A preparar a sua comunidade…</span>
  </div>
</body>
</html>
